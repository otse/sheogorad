		margin: 0;
		padding: 50px;

	h0 {}

	.nav-buttons {

		gap: 8px;
		flex-shrink: 0;
		align-items: flex-start;
		flex-direction: row;
	}

	.nav-buttons button {
		background-color: rgba(0, 0, 0, 0.6);
	}

	}

	nav {
		width: 100%;
		padding: 12px;
		margin-bottom: 10px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-direction: row-reverse;
		gap: 16px;
	}

		<div id="generationDialog" rune-user-interface>
			<h2>Sheogorad Options</h2>
