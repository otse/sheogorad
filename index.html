<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sheogorad</title>

	<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

	<script type="module" src="js/sheogorad.js"></script>

	<link rel="stylesheet" href="messy.css">
	<link rel="stylesheet" href="rune.css">
	<link rel="stylesheet" href="runetricks.css">
	<link rel="stylesheet" href="rnl.css"> <!-- layout -->

	<style>
		@font-face {
			font-family: 'Pelagiad';
			src: url('Pelagiad.ttf') format('truetype');
		}
	</style>

	<link rel="stylesheet" href="css/main.css">

</head>
<style>
	@import url('https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Itim&family=Macondo&display=swap');

	body {
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		background-color: #1e1e1e;
		x-background: url(https://cdna.artstation.com/p/assets/images/images/022/972/972/large/dominik-zdenkovic-20191222-thu-bitter-coast3.jpg?1577548887);
		background-size: cover;
		background-repeat: no-repeat;
		background-attachment: fixed;
		width: 100%;
		height: 100%;
		color: #f300ff;
		margin: 0;
		padding: 50px;
	}

	h0 {}

	.nav-buttons {
		display: flex;
		gap: 8px;
		flex-shrink: 0;
		align-items: flex-start;
		flex-direction: row;
	}

	.nav-buttons button {
		/* background-color: rgba(0, 0, 0, 0.6); */
	}

	.nav-buttons .mw-menu-button.muted {
		opacity: 0.6;
	}

	nav {
		position: absolute;
		top: 0;
		width: 100%;
		padding: 12px;
		/* margin-bottom: 10px; */
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-direction: row-reverse;
		gap: 16px;
		/* background-image: url(img/RockRough0001_2_download600.jpg); */
		background-size: 25%;
	}
</style>

<body>
	<rn-elements>
		<rn-wnds></rn-wnds>
		<h0></h0>
		<br />
		<audio id="bg-music" loop>
			<source src="mw-menu-vanilla/blessing-of-vivec.mp3" type="audio/mpeg">
		</audio>

		<nav>
			<div class="nav-buttons">
				<button type="button" id="mute-btn" class="rn-big-button" title="Mute">
					<span data-text="Music Player" class="text-gradient-gold">Music Player</span>
				</button>
				<button type="button" id="new-box-btn" class="rn-big-button" title="Open new window">
					<span data-text="Lore" class="text-gradient-gold">Lore</span>
				</button>
			</div>
		</nav>

		<template id="things-to-do-wnd-template">
			<div style="flex-direction: column; display: flex;">
				Things to do in Sheogorad:<br />
				<ul>
					<li>Explore the settlements</li>
					<li>Meet the NPCs</li>
					<li>Complete quests</li>
					<li>Trade items</li>
					<li>Discover hidden locations</li>
				</ul>
			</div>
		</template>

		<template id="music-player-wnd-template">
			<div style="flex-direction: column; display: flex;">
				Music Player:<br />
				<ul>
					<li>Play background music</li>
					<li>Pause music</li>
					<li>Adjust volume</li>
					<li>Skip tracks</li>
					<li>Manage playlist</li>
				</ul>
			</div>
		</template>

		<template id="area-list-wnd-template">
			<!--<div class="explanator">Stepped:</div>
			<div class="rn-divider"></div>-->
			<div class="rn-scroll rnl-region-wnd-list">
			</div>
			<div class="rnl-region-wnd-area" style="">
				<div class="rnl-region-wnd-docking-zone">
				</div>
			</div>
		</template>

		<template id="building-viewer-wnd-template">
			<div class="rnl-building-wnd-div"></div>
			</div>
		</template>

		<template id="npc-wnd-template">
			<!--<div class="rn-bordered rn-scroll" style="width: 100%;">-->
			<div class="rn-stats-layout row">
				<div class="rn-stats-left column">
					<div class="rn-npc-title" data-bind="title">
						<span data-bind="name"></span>, <span data-bind="race"></span> <span data-bind="class"></span>
						of <span data-bind="hometown"></span>
					</div>
					<div class="rn-bordered" style="flex-direction: column;">
						<div class="rn-stat-bar">
							<span class="">Life</span><span class="" data-bind="life.text">61/78</span>
							<div class="rn-stat-bar-track">
								<div class="rn-stat-bar-fill rn-stat-bar-health" style="width: 78%"
									data-bind-style="width:life.percent"></div>
							</div>
						</div>
						<div class="rn-stat-bar">
							<span class="">Magicka</span><span class="" data-bind="magicka.text">206/206</span>
							<div class="rn-stat-bar-track">
								<div class="rn-stat-bar-fill rn-stat-bar-magicka" style="width: 100%"
									data-bind-style="width:magicka.percent">
								</div>
							</div>
						</div>
					</div>

					<div class="rn-bordered">
						<div class="rn-space-between">
							<span class="">Might</span>
							<span class="" data-bind="pillars.might">57</span>
						</div>
						<div class="rn-space-between">
							<span class="">Will</span>
							<span class="" data-bind="pillars.will">59</span>
						</div>
						<div class="rn-space-between">
							<span class="">Wits</span>
							<span class="" data-bind="pillars.wits">41</span>
						</div>
						<div class="rn-space-between">
							<span class="">Charm</span>
							<span class="" data-bind="pillars.charm">1</span>
						</div>
					</div>
				</div>
			</div>
		</template>
		<template id="rn-wnd-template">
			<div class="rn-wnd-position">
				<div class="rn-wnd" moveable resizeable closable minimizable title="Example">
					<div class="rn-wnd-title-bar">
						<span></span>
						<div>
							<span>
								<span class="text-gradient-title" data-text="Wnd">Wnd</span>
							</span>
						</div>
						<div style="">
							<button type="button" class="rn-title-bar-button min" title="Min">
								<span class="text-gradient-button" data-text="-">-</span> <!-- ⤥ -->
							</button>
							<button type="button" class="rn-title-bar-button close" title="Close">
								<span class="text-gradient-button" data-text="x">x</span>
								<!-- <span class="gem-icon">💎</span> -->
							</button>
						</div>
					</div>
					<div class="rn-wnd-content">
						Default-Content
					</div>
				</div>
			</div>
		</template>

		<template id="rn-npc-wnd-content-template">

		</template>

		<div id="mainDockingZones">
			<div id="dockingZoneLeft"></div>
			<div id="dockingZoneRight"></div>
		</div>
	</rn-elements>

	<script>
		function generateIsland() {

		}
	</script>
</body>

</html>
